<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM : Énergie (Sources et Formes)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .quiz-container {
            background-color: #fff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .question-block {
            display: none;
            margin-bottom: 20px;
        }
        .question-block.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h3 {
            color: #34495e;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button.option-btn {
            background-color: #f8f9fa;
            border: 2px solid #dee2e6;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            color: #495057;
        }
        button.option-btn:hover {
            background-color: #e9ecef;
            border-color: #ced4da;
        }
        button.option-btn.selected {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .progress-text {
            color: #95a5a6;
            font-weight: bold;
        }
        button.nav-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.nav-btn:hover {
            background-color: #27ae60;
        }
        button.nav-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #result-container {
            display: none;
            padding: 20px 0;
        }
        .score-header {
            text-align: center;
            margin-bottom: 30px;
        }
        #score {
            font-size: 36px;
            font-weight: bold;
            color: #e74c3c;
            display: block;
            margin: 10px 0;
        }
        .correction-item {
            background-color: #f8f9fa;
            border-left: 5px solid #bdc3c7;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 5px 5px 0;
        }
        .correction-item.correct {
            border-left-color: #2ecc71;
        }
        .correction-item.incorrect {
            border-left-color: #e74c3c;
        }
        .correction-q {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .correction-ans {
            margin-bottom: 5px;
            font-size: 14px;
        }
        .correction-expl {
            color: #2980b9;
            font-size: 14px;
            font-style: italic;
        }
        .restart-btn {
            background-color: #3498db;
            margin-top: 20px;
            width: 100%;
            padding: 15px;
        }
        .restart-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>QCM : Énergie et Conversions</h1>
    <div class="subtitle">10 questions tirées au sort (Niveau 6ème)</div>
    
    <div id="quiz">
        <!-- Les questions sont injectées ici par JavaScript -->
    </div>
    
    <div class="nav-container" id="nav-container">
        <button id="prev-btn" class="nav-btn" disabled>Précédent</button>
        <span class="progress-text" id="progress-text">Question 1 / 10</span>
        <button id="next-btn" class="nav-btn">Suivant</button>
    </div>
    
    <div id="result-container">
        <div class="score-header">
            <h2>Résultat du test</h2>
            <span id="score"></span>
            <p id="feedback-text"></p>
        </div>
        <div id="corrections-list">
            <!-- Les corrections seront affichées ici -->
        </div>
        <button class="nav-btn restart-btn" onclick="location.reload()">Refaire un test (Nouvelles questions)</button>
    </div>
</div>

<script>
    const questionBank = [
        // 2 Questions sur la différence Source / Forme
        { 
            q: "Quelle est la principale différence entre une source d'énergie et une forme d'énergie ?", 
            opts: [
                "La source est la matière ou le phénomène naturel qui fournit l'énergie, la forme est sa manifestation.", 
                "La forme d'énergie est toujours naturelle, la source est fabriquée par l'humain.", 
                "Il n'y a aucune différence, ces deux mots désignent la même chose."
            ], 
            ans: 0,
            corr: "Une source (comme le Soleil ou le vent) est la matière première ou le phénomène naturel qui fournit de l'énergie. La forme (lumineuse, cinétique) est comment elle se manifeste."
        },
        { 
            q: "Le bois que l'on s'apprête à brûler dans une cheminée pour se réchauffer est...", 
            opts: ["Une forme d'énergie.", "Une source d'énergie.", "Un convertisseur d'énergie."], 
            ans: 1,
            corr: "Le bois est la matière première que l'on utilise pour obtenir de l'énergie. C'est donc une source (qui contient de l'énergie chimique)."
        },
        
        // 28 autres questions sur les formes d'énergie (sans énergie de position)
        { q: "Léa mange une barre de céréales. Quelle forme d'énergie son corps va-t-il récupérer ?", opts: ["Énergie chimique", "Énergie cinétique", "Énergie thermique"], ans: 0, corr: "Les aliments sont des réservoirs d'énergie chimique." },
        { q: "Un skateur dévale une pente à toute vitesse. Quelle est la principale énergie associée à son déplacement ?", opts: ["Énergie électrique", "Énergie cinétique", "Énergie thermique"], ans: 1, corr: "Tout objet en mouvement possède de l'énergie cinétique." },
        { q: "On fait fondre du chocolat au bain-marie. Quelle énergie fait fondre le chocolat ?", opts: ["Énergie lumineuse", "Énergie électrique", "Énergie thermique"], ans: 2, corr: "La chaleur de l'eau apporte de l'énergie thermique." },
        { q: "Un ventilateur branché sur une prise murale reçoit quelle énergie pour démarrer ?", opts: ["Énergie chimique", "Énergie cinétique", "Énergie électrique"], ans: 2, corr: "La prise murale fournit de l'énergie électrique à l'appareil." },
        { q: "Des panneaux photovoltaïques captent l'énergie du Soleil. De quel type d'énergie s'agit-il ?", opts: ["Énergie électrique", "Énergie lumineuse", "Énergie thermique"], ans: 1, corr: "Le Soleil envoie des rayons lumineux (énergie lumineuse) que le panneau convertit." },
        { q: "L'essence stockée dans une tondeuse est un réservoir de quelle énergie ?", opts: ["Énergie chimique", "Énergie thermique", "Énergie cinétique"], ans: 0, corr: "Les carburants (essence, pétrole) stockent de l'énergie chimique libérée lors de la combustion." },
        { q: "Les pales d'une éolienne tournent avec le vent. Quelle énergie possède le vent ?", opts: ["Énergie électrique", "Énergie chimique", "Énergie cinétique"], ans: 2, corr: "Le vent est de l'air en mouvement, il possède donc de l'énergie cinétique." },
        { q: "En se frottant les mains en hiver, quelle énergie est produite ?", opts: ["Énergie chimique", "Énergie lumineuse", "Énergie thermique"], ans: 2, corr: "Les frottements créent de la chaleur, donc de l'énergie thermique." },
        { q: "Un éclair frappe un arbre. Quelle est l'énergie transportée par la foudre ?", opts: ["Énergie chimique", "Énergie électrique", "Énergie cinétique"], ans: 1, corr: "La foudre est une immense décharge d'énergie électrique." },
        { q: "Une pile neuve non branchée contient quelle forme d'énergie ?", opts: ["Énergie cinétique", "Énergie électrique", "Énergie chimique"], ans: 2, corr: "Les composants à l'intérieur de la pile stockent de l'énergie chimique." },
        { q: "Un radiateur allumé dans une chambre produit principalement quelle énergie ?", opts: ["Énergie thermique", "Énergie chimique", "Énergie lumineuse"], ans: 0, corr: "Le but d'un radiateur est de chauffer la pièce grâce à l'énergie thermique." },
        { q: "Un train TGV roule à 300 km/h. Il possède une grande quantité d'énergie...", opts: ["Chimique", "Cinétique", "Thermique"], ans: 1, corr: "Plus un objet est lourd et va vite, plus son énergie cinétique (de mouvement) est grande." },
        { q: "Le charbon de bois prêt pour le barbecue contient de l'énergie...", opts: ["Électrique", "Thermique", "Chimique"], ans: 2, corr: "Le charbon est un combustible : il stocke de l'énergie chimique." },
        { q: "Une lampe de bureau éclaire votre cahier. Quelle énergie produit-elle pour vous aider à lire ?", opts: ["Énergie chimique", "Énergie cinétique", "Énergie lumineuse"], ans: 2, corr: "La lampe convertit l'électricité en énergie lumineuse." },
        { q: "Votre smartphone est en charge sur le secteur. Quelle énergie reçoit-il de la prise ?", opts: ["Énergie lumineuse", "Énergie électrique", "Énergie chimique"], ans: 1, corr: "La prise de courant fournit de l'énergie électrique." },
        { q: "L'eau bout dans une casserole. Quelle énergie possède l'eau bouillante ?", opts: ["Énergie thermique", "Énergie électrique", "Énergie chimique"], ans: 0, corr: "La température élevée de l'eau indique une forte énergie thermique." },
        { q: "Un chien court dans le parc. Quelle énergie est liée à son mouvement ?", opts: ["Énergie lumineuse", "Énergie chimique", "Énergie cinétique"], ans: 2, corr: "Le mouvement correspond toujours à l'énergie cinétique." },
        { q: "Une pomme est un réservoir d'énergie pour notre corps. Quelle est cette énergie ?", opts: ["Énergie chimique", "Énergie cinétique", "Énergie électrique"], ans: 0, corr: "Comme tous les aliments, la pomme contient de l'énergie chimique." },
        { q: "Un phare marin guide les bateaux la nuit. Quelle énergie utile produit-il ?", opts: ["Énergie thermique", "Énergie cinétique", "Énergie lumineuse"], ans: 2, corr: "Le but du phare est d'émettre un faisceau de lumière (énergie lumineuse)." },
        { q: "Une machine à laver a besoin d'être branchée. Quelle énergie la fait fonctionner ?", opts: ["Énergie électrique", "Énergie thermique", "Énergie chimique"], ans: 0, corr: "C'est un appareil électrique, il fonctionne grâce à l'énergie électrique." },
        { q: "Du bois de chauffage empilé dans le jardin stocke de l'énergie...", opts: ["Cinétique", "Thermique", "Chimique"], ans: 2, corr: "Tant qu'il n'est pas brûlé, le bois stocke de l'énergie sous forme chimique." },
        { q: "Un avion vole dans le ciel. Son déplacement correspond à de l'énergie...", opts: ["Cinétique", "Chimique", "Électrique"], ans: 0, corr: "Le déplacement dans les airs est un mouvement (énergie cinétique)." },
        { q: "Le four de la cuisine chauffe un gratin. Quelle énergie est transférée au plat ?", opts: ["Énergie électrique", "Énergie lumineuse", "Énergie thermique"], ans: 2, corr: "Le four produit de la chaleur, c'est-à-dire de l'énergie thermique." },
        { q: "L'écran d'une tablette allumée nous permet de voir des images grâce à l'énergie...", opts: ["Thermique", "Lumineuse", "Chimique"], ans: 1, corr: "L'écran émet de la lumière (énergie lumineuse)." },
        { q: "Le réseau Enedis achemine dans nos maisons de l'énergie...", opts: ["Électrique", "Chimique", "Thermique"], ans: 0, corr: "Les câbles acheminent l'énergie électrique jusqu'à nos prises." },
        { q: "Le gaz de ville utilisé pour cuisiner contient de l'énergie...", opts: ["Thermique", "Électrique", "Chimique"], ans: 2, corr: "Le gaz est un combustible qui stocke de l'énergie chimique." },
        { q: "Un cycliste roule sur une piste cyclable. Il possède de l'énergie...", opts: ["Thermique", "Chimique", "Cinétique"], ans: 2, corr: "Il est en mouvement, il possède donc de l'énergie cinétique." },
        { q: "Une tasse de thé très chaud fume sur la table. Elle possède de l'énergie...", opts: ["Énergie thermique", "Énergie cinétique", "Énergie lumineuse"], ans: 0, corr: "La chaleur du thé est due à son énergie thermique." },
        { q: "Le laser utilisé par le professeur projette un point rouge grâce à l'énergie...", opts: ["Thermique", "Lumineuse", "Cinétique"], ans: 1, corr: "Le laser concentre des rayons lumineux." },
        { q: "Un fer à repasser branché chauffe les vêtements. Quelle énergie REÇOIT-il du mur ?", opts: ["Énergie électrique", "Énergie thermique", "Énergie cinétique"], ans: 0, corr: "Il reçoit de l'énergie électrique (et la convertit ensuite en énergie thermique)." }
    ];

    const NUM_QUESTIONS = 10;
    let selectedQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = new Array(NUM_QUESTIONS).fill(null);

    const quizContainer = document.getElementById('quiz');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressText = document.getElementById('progress-text');
    const resultContainer = document.getElementById('result-container');
    const navContainer = document.getElementById('nav-container');
    const scoreSpan = document.getElementById('score');
    const feedbackText = document.getElementById('feedback-text');
    const correctionsList = document.getElementById('corrections-list');

    // Mélange du tableau (Fisher-Yates)
    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // Initialisation
    function initQuiz() {
        const shuffledBank = shuffleArray([...questionBank]);
        selectedQuestions = shuffledBank.slice(0, NUM_QUESTIONS);

        selectedQuestions.forEach((q, index) => {
            const block = document.createElement('div');
            block.classList.add('question-block');
            if (index === 0) block.classList.add('active');
            block.id = `q-block-${index}`;

            const title = document.createElement('h3');
            title.textContent = `Question ${index + 1} : ${q.q}`;

            const optionsDiv = document.createElement('div');
            optionsDiv.classList.add('options');

            q.opts.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.textContent = opt;
                btn.onclick = () => selectOption(index, optIndex, btn);
                optionsDiv.appendChild(btn);
            });

            block.appendChild(title);
            block.appendChild(optionsDiv);
            quizContainer.appendChild(block);
        });

        updateUI();
    }

    // Sélection d'une réponse
    function selectOption(qIndex, optIndex, btn) {
        userAnswers[qIndex] = optIndex;
        const options = document.querySelectorAll(`#q-block-${qIndex} .option-btn`);
        options.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    // Mise à jour de l'affichage (Questions)
    function updateUI() {
        document.querySelectorAll('.question-block').forEach(b => b.classList.remove('active'));
        document.getElementById(`q-block-${currentQuestionIndex}`).classList.add('active');
        
        progressText.textContent = `Question ${currentQuestionIndex + 1} / ${NUM_QUESTIONS}`;
        
        prevBtn.disabled = currentQuestionIndex === 0;
        
        if (currentQuestionIndex === NUM_QUESTIONS - 1) {
            nextBtn.textContent = 'Terminer et voir la correction';
            nextBtn.style.backgroundColor = '#e74c3c';
        } else {
            nextBtn.textContent = 'Suivant';
            nextBtn.style.backgroundColor = '#2ecc71';
        }
    }

    // Navigation
    prevBtn.addEventListener('click', () => {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            updateUI();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentQuestionIndex] === null) {
            alert("Veuillez choisir une réponse avant de passer à la suite !");
            return;
        }

        if (currentQuestionIndex < NUM_QUESTIONS - 1) {
            currentQuestionIndex++;
            updateUI();
        } else {
            calculateScoreAndShowCorrections();
        }
    });

    // Calcul du score et affichage des corrections
    function calculateScoreAndShowCorrections() {
        score = 0;
        correctionsList.innerHTML = ''; // Vider l'ancienne liste si besoin

        userAnswers.forEach((ans, index) => {
            const q = selectedQuestions[index];
            const isCorrect = (ans === q.ans);
            if (isCorrect) score++;

            // Création du bloc de correction
            const corrBlock = document.createElement('div');
            corrBlock.className = `correction-item ${isCorrect ? 'correct' : 'incorrect'}`;
            
            const qText = document.createElement('div');
            qText.className = 'correction-q';
            qText.textContent = `${index + 1}. ${q.q}`;
            
            const ansText = document.createElement('div');
            ansText.className = 'correction-ans';
            ansText.innerHTML = `<strong>Votre réponse :</strong> ${q.opts[ans]} ${isCorrect ? '✅' : '❌'}<br>`;
            if (!isCorrect) {
                ansText.innerHTML += `<strong>Bonne réponse :</strong> ${q.opts[q.ans]}`;
            }

            const explText = document.createElement('div');
            explText.className = 'correction-expl';
            explText.textContent = `Correction : ${q.corr}`;

            corrBlock.appendChild(qText);
            corrBlock.appendChild(ansText);
            corrBlock.appendChild(explText);
            correctionsList.appendChild(corrBlock);
        });

        // Affichage des résultats globaux
        quizContainer.style.display = 'none';
        navContainer.style.display = 'none';
        document.querySelector('.subtitle').style.display = 'none';
        resultContainer.style.display = 'block';
        
        scoreSpan.textContent = `${score} / ${NUM_QUESTIONS}`;

        if (score >= 8) {
            feedbackText.innerHTML = "<strong>Excellent !</strong> Vous maîtrisez bien ce chapitre sur l'énergie.";
        } else if (score >= 5) {
            feedbackText.innerHTML = "<strong>Bon travail.</strong> Regardez bien la correction ci-dessous pour ne plus faire les erreurs.";
        } else {
            feedbackText.innerHTML = "<strong>Attention...</strong> Lisez attentivement la correction de chaque question pour mieux comprendre.";
        }
    }

    // Démarrage
    initQuiz();
</script>
</body>
</html>
