<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices de Masse Volumique - Générateur Intégral</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #16a085;
            --success: #27ae60;
            --error: #c0392b;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #dcdde1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 15px;
        }

        .wrapper { max-width: 800px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(135deg, var(--primary), #34495e);
            color: white;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 { font-size: 1.6rem; margin-bottom: 5px; }
        header p { font-size: 0.95rem; opacity: 0.9; }

        .score-box {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
            border: 2px solid var(--accent);
            color: var(--accent);
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
            transition: all 0.3s ease;
        }

        .card.verified-correct { border-left-color: var(--success); }
        .card.verified-error { border-left-color: var(--error); }

        .ex-title {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .flex-container { display: block; margin-bottom: 15px; }
        .step-row { display: table; width: 100%; margin-bottom: 10px; }
        .step-cell { display: table-cell; vertical-align: middle; padding: 6px 4px; }
        .cell-start { width: 25%; font-weight: 600; text-align: right; padding-right: 10px; font-size: 1.1rem; }
        .cell-arrow { width: 8%; text-align: center; color: var(--accent); font-weight: bold; }
        .cell-input { width: 67%; }

        .input-group { display: table; width: 100%; }
        .input-group input, .input-group .unit-label { display: table-cell; }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
            border: 2px solid var(--border);
            border-radius: 6px 0 0 6px;
            text-align: center;
            background-color: #fafafa;
        }
        input[type="text"]:focus { border-color: var(--accent); background-color: #fff; outline: none; }
        input[type="text"]:disabled { background-color: #eef2f5; color: #7f8c8d; }

        .unit-label {
            width: 90px;
            background-color: #e2e8f0;
            border: 2px solid var(--border);
            border-left: none;
            padding: 10px 4px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 0 6px 6px 0;
            color: #4a5568;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background-color: #1a252f; }
        .btn-check-ex { background-color: var(--accent); margin-top: 10px; }
        .btn-check-ex:hover { background-color: #117a65; }

        .feedback-area { margin-top: 15px; display: none; }
        
        .correction-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 4px solid var(--primary);
            border-radius: 0 6px 6px 0;
            font-size: 1rem;
            line-height: 1.8;
            overflow-x: auto;
        }
        
        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .correction-step {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .math-fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 8px;
            line-height: 1.2;
        }
        .math-fraction .num {
            border-bottom: 2px solid var(--text);
            padding: 2px 6px;
            width: 100%;
            text-align: center;
        }
        .math-fraction .den {
            padding: 2px 6px;
            width: 100%;
            text-align: center;
        }
        .math-eq {
            margin: 0 5px;
            font-weight: bold;
        }
        .expected-value {
            font-weight: bold;
            color: var(--accent);
            background: #e8f8f5;
            padding: 4px 8px;
            border-radius: 4px;
            margin-left: 8px;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .cell-start { width: 30%; font-size: 1rem; padding-right: 5px; }
            .unit-label { width: 75px; font-size: 0.85rem; }
            .correction-step { flex-direction: column; align-items: flex-start; }
            .math-fraction { margin: 5px 0; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>Conversions de Masses Volumiques</h1>
    </header>

    <div class="score-box" id="score-display">
        Exercices réussis : 0 / 5
    </div>

    <div id="exercise-list"></div>

    <button class="btn" onclick="loadExercises()" style="margin: 20px 0;">Recommencer une nouvelle série</button>
</div>

<script>
    // --- MOTEUR DE CONVERSION ---
    
    // Références des facteurs de conversion (base : g et L)
    const M = { 'kg':1000, 'hg':100, 'dag':10, 'g':1, 'dg':0.1, 'cg':0.01, 'mg':0.001 };
    const V = { 'm³':1000, 'dm³':1, 'cm³':0.001, 'hL':100, 'daL':10, 'L':1, 'dL':0.1, 'cL':0.01, 'mL':0.001 };

    // Liste de parcours de conversions logiques (unité départ -> cible 1 -> cible 2)
    const pathsList = [
        ['g', 'mL', 'kg', 'm³', 'hg', 'dL'],
        ['mg', 'mL', 'g', 'daL', 'dag', 'L'],
        ['g', 'cm³', 'kg', 'm³', 'g', 'L'],
        ['kg', 'm³', 'g', 'cm³', 'mg', 'mL'],
        ['g', 'mL', 'kg', 'm³', 'dg', 'cL'],
        ['kg', 'L', 'g', 'cm³', 'cg', 'mL'],
        ['dg', 'cL', 'g', 'L', 'kg', 'm³'],
        ['hg', 'L', 'g', 'mL', 'mg', 'cm³'],
        ['cg', 'mL', 'g', 'L', 'dag', 'daL'],
        ['mg', 'cm³', 'kg', 'm³', 'g', 'dL'],
        ['dag', 'L', 'g', 'mL', 'kg', 'm³'],
        ['g', 'daL', 'mg', 'mL', 'cg', 'cL']
    ];

    // Formate les nombres proprement en évitant les notations scientifiques (ex: 1e-6)
    function formatNum(n) {
        let nStr = parseFloat(n.toPrecision(12)).toString(); 
        if (nStr.includes('e')) {
            nStr = n.toFixed(10).replace(/0+$/, '').replace(/\.$/, '');
        }
        return nStr.replace('.', ',');
    }

    function formatUnit(m, v) { return m + '/' + v; }

    function frac(num, den) {
        return `<div class="math-fraction"><span class="num">${num}</span><span class="den">${den}</span></div>`;
    }

    const eq = `<span class="math-eq">=</span>`;

    // Calcule la fraction de conversion entre deux unités de masse volumique
    function convertStep(val, m_in, v_in, m_out, v_out) {
        let mass_ratio = M[m_in] / M[m_out];
        let vol_ratio = V[v_in] / V[v_out];
        let num = val * mass_ratio;
        let den = 1 * vol_ratio;
        let res = num / den;

        return {
            num_str: formatNum(num) + ' ' + m_out,
            den_str: formatNum(den) + ' ' + v_out,
            res_val: res,
            res_str: formatNum(res) + ' ' + m_out + '/' + v_out
        };
    }

    // Générateur d'exercices aléatoires à partir des parcours possibles
    function generateDataset() {
        // Mélange la liste des parcours et en prend 5
        const shuffledPaths = pathsList.sort(() => 0.5 - Math.random()).slice(0, 5);
        const dataset = [];
        
        shuffledPaths.forEach(p => {
            let m0 = p[0], v0 = p[1], m1 = p[2], v1 = p[3], m2 = p[4], v2 = p[5];
            
            // Valeur aléatoire pour éviter la monotonie
            let val = (Math.random() > 0.5) 
                ? Math.floor(Math.random() * 900) + 10 // Nombre entier
                : Math.floor(Math.random() * 1000) / 10 + 0.1; // Un chiffre après la virgule

            let u0 = formatUnit(m0, v0);
            let u1 = formatUnit(m1, v1);
            let u2 = formatUnit(m2, v2);

            let step1 = convertStep(val, m0, v0, m1, v1);
            let step2 = convertStep(val, m0, v0, m2, v2);

            let corr1 = `<b>Étape 1 :</b> ${frac(formatNum(val)+' '+m0, '1 '+v0)} ${eq} ${frac(step1.num_str, step1.den_str)} ${eq} <span class='expected-value'>${step1.res_str}</span>`;
            let corr2 = `<b>Étape 2 :</b> ${frac(formatNum(val)+' '+m0, '1 '+v0)} ${eq} ${frac(step2.num_str, step2.den_str)} ${eq} <span class='expected-value'>${step2.res_str}</span>`;

            dataset.push({
                val: val, 
                unit0: u0, 
                t1: { unit: u1, ans: step1.res_val }, 
                t2: { unit: u2, ans: step2.res_val },
                correction: [corr1, corr2]
            });
        });
        return dataset;
    }

    // --- INTERFACE ET LOGIQUE D'AFFICHAGE ---

    let currentExercises = [];
    let score = 0;
    let completed = 0;

    function loadExercises() {
        const container = document.getElementById('exercise-list');
        container.innerHTML = '';
        currentExercises = generateDataset(); 
        score = 0;
        completed = 0;
        updateScoreDisplay();
        
        currentExercises.forEach((ex, idx) => {
            const displayVal = formatNum(ex.val);
            
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${idx}`;
            
            card.innerHTML = `
                <div class="ex-title">Exercice ${idx + 1}</div>
                <div class="flex-container">
                    <div class="step-row">
                        <div class="step-cell cell-start">${displayVal} ${ex.unit0}</div>
                        <div class="step-cell cell-arrow">➔</div>
                        <div class="step-cell cell-input">
                            <div class="input-group">
                                <input type="text" id="ex-${idx}-1" inputmode="decimal" placeholder="..." oninput="resetCard(${idx})">
                                <span class="unit-label">${ex.t1.unit}</span>
                            </div>
                        </div>
                    </div>
                    <div class="step-row">
                        <div class="step-cell cell-start" style="color: #7f8c8d; font-size:0.9rem;">Étape suivante</div>
                        <div class="step-cell cell-arrow">➔</div>
                        <div class="step-cell cell-input">
                            <div class="input-group">
                                <input type="text" id="ex-${idx}-2" inputmode="decimal" placeholder="..." oninput="resetCard(${idx})">
                                <span class="unit-label">${ex.t2.unit}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <button id="btn-${idx}" class="btn btn-check-ex" onclick="verifyExercise(${idx})">Vérifier cet exercice</button>
                
                <div id="feedback-${idx}" class="feedback-area">
                    <div id="result-msg-${idx}" class="result-title"></div>
                    <div class="correction-box">
                        <div class="correction-step">${ex.correction[0]}</div>
                        <div class="correction-step">${ex.correction[1]}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function resetCard(idx) {
        document.getElementById(`card-${idx}`).className = 'card';
        document.getElementById(`feedback-${idx}`).style.display = 'none';
        document.getElementById(`btn-${idx}`).style.display = 'block';
    }

    function verifyExercise(idx) {
        const ex = currentExercises[idx];
        const rawIn1 = document.getElementById(`ex-${idx}-1`).value.trim().replace(',', '.');
        const rawIn2 = document.getElementById(`ex-${idx}-2`).value.trim().replace(',', '.');

        if (rawIn1 === "" || rawIn2 === "") {
            alert("Veuillez remplir les deux champs avant de vérifier.");
            return;
        }

        const val1 = parseFloat(rawIn1);
        const val2 = parseFloat(rawIn2);

        // Vérification avec une légère tolérance pour les éventuels arrondis (arrondi à 6 décimales)
        const is1Correct = !isNaN(val1) && parseFloat(val1.toFixed(6)) === parseFloat(ex.t1.ans.toFixed(6));
        const is2Correct = !isNaN(val2) && parseFloat(val2.toFixed(6)) === parseFloat(ex.t2.ans.toFixed(6));

        const card = document.getElementById(`card-${idx}`);
        const feedbackArea = document.getElementById(`feedback-${idx}`);
        const resultMsg = document.getElementById(`result-msg-${idx}`);
        const btn = document.getElementById(`btn-${idx}`);

        feedbackArea.style.display = 'block';
        btn.style.display = 'none';
        
        document.getElementById(`ex-${idx}-1`).disabled = true;
        document.getElementById(`ex-${idx}-2`).disabled = true;

        if (is1Correct && is2Correct) {
            card.className = "card verified-correct";
            resultMsg.innerHTML = "Résultat : <span style='color: var(--success)'>JUSTE ✅</span>";
            score++;
        } else {
            card.className = "card verified-error";
            resultMsg.innerHTML = "Résultat : <span style='color: var(--error)'>FAUX ❌</span>";
            if(!is1Correct) document.getElementById(`ex-${idx}-1`).style.borderColor = "var(--error)";
            if(!is2Correct) document.getElementById(`ex-${idx}-2`).style.borderColor = "var(--error)";
        }
        
        completed++;
        updateScoreDisplay();
    }

    function updateScoreDisplay() {
        const scoreBox = document.getElementById('score-display');
        scoreBox.innerHTML = `Exercices réussis : ${score} / ${completed} (sur ${currentExercises.length} au total)`;
    }

    window.onload = loadExercises;
</script>
</body>
</html>
