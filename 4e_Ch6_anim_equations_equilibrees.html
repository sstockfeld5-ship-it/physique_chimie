<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Équilibrer une équation chimique - 4ème</title>
    <style>
        /* --- VARIABLES ET RESET --- */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --border-color: #e2e8f0;
            --c-color: #333333;
            --o-color: #ef4444;
            --h-color: #f8fafc;
            --n-color: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            background: var(--card-bg); padding: clamp(15px, 3vw, 30px); border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            max-width: 1100px; margin: 0 auto; border: 1px solid var(--border-color);
        }

        h1 { color: #0f172a; text-align: center; margin-bottom: 5px; font-size: clamp(1.4em, 3vw, 1.8em);}
        .subtitle { text-align: center; color: var(--text-light); margin-bottom: 25px; font-size: clamp(0.9em, 2vw, 1.1em);}

        /* --- SÉLECTEUR DE RÉACTION --- */
        .reaction-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn-menu { background: white; border: 2px solid #cbd5e1; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: clamp(0.85em, 1.5vw, 1em); color: var(--text-main); }
        .btn-menu:hover { border-color: var(--primary); background: #eff6ff; }
        .btn-menu.active { border-color: var(--primary); background: var(--primary); color: white; }

        /* --- CONSTRUCTEUR D'ÉQUATION (FLUIDE 1 LIGNE SANS SCROLL) --- */
        .equation-builder { 
            background: #f1f5f9; padding: clamp(10px, 2vw, 20px); border-radius: 10px; 
            margin-bottom: 20px; border: 1px solid #cbd5e1; text-align: center; 
            width: 100%;
        }

        .equation-row {
            display: flex; align-items: center; justify-content: center; 
            gap: clamp(2px, 0.8vw, 12px); 
            flex-wrap: nowrap; /* Interdit le passage à la ligne */
            font-size: clamp(11px, 2.2vw, 32px); /* Compression fluide de la police */
            padding: clamp(10px, 2vw, 15px); 
            background: white; border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-height: 80px; 
            width: 100%; box-sizing: border-box;
            transition: all 0.5s ease;
            white-space: nowrap; /* Sécurité anti-retour à la ligne */
        }

        .eq-term { display: flex; align-items: center; }

        .coef-widget { 
            display: flex; align-items: center; background: #e2e8f0; border-radius: 6px; 
            overflow: hidden; margin-right: clamp(4px, 1vw, 12px); border: 1px solid #cbd5e1;
            transition: all 0.3s ease;
        }

        .btn-coef { 
            background: #e2e8f0; border: none; 
            padding: clamp(4px, 1vw, 10px) clamp(6px, 1.2vw, 16px); 
            font-size: 0.8em; font-weight: bold; cursor: pointer; color: #475569; transition: background 0.2s; 
        }
        .btn-coef:hover { background: var(--primary); color: white; }
        
        .coef-val { 
            width: clamp(20px, 3vw, 40px); text-align: center; background: white; 
            font-weight: bold; padding: clamp(4px, 1vw, 8px) 0; color: var(--primary); 
        }
        
        .chem-formula { font-family: 'Courier New', monospace; font-weight: bold; color: #1e293b; transition: color 0.3s;}
        
        .eq-plus { color: #94a3b8; font-weight: bold; margin: 0 clamp(4px, 1vw, 15px); transition: color 0.3s;}
        .eq-arrow { color: var(--primary); font-weight: bold; margin: 0 clamp(6px, 1.5vw, 20px); transition: color 0.3s;}

        /* --- ÉTAT : ÉQUATION ÉQUILIBRÉE --- */
        .is-balanced { 
            border: 3px solid var(--success); background: #f0fdf4; 
            box-shadow: 0 0 20px rgba(22, 163, 74, 0.15); transform: scale(1.02);
        }
        .is-balanced .btn-coef { display: none; }
        .is-balanced .coef-widget { background: transparent; border: none; margin-right: clamp(2px, 0.5vw, 5px); }
        .is-balanced .coef-val { background: transparent; color: var(--success); font-size: 1.1em; width: auto; padding-right: 5px; }
        .is-balanced .coef-val[data-val="1"] { display: none; }
        .is-balanced .chem-formula { color: var(--success); font-size: 1.2em;}
        .is-balanced .eq-plus, .is-balanced .eq-arrow { color: var(--success); }

        .btn-edit { background: white; border: 2px solid #cbd5e1; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--text-light); margin-top: 20px; transition: 0.2s;}
        .btn-edit:hover { border-color: var(--text-main); color: var(--text-main); }

        /* --- ZONE VISUELLE DES MOLÉCULES --- */
        .visual-arena { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;}
        .arena-side { flex: 1; background: white; border: 2px dashed #cbd5e1; border-radius: 10px; padding: 20px; min-height: 220px; min-width: 250px;}
        .arena-title { text-align: center; font-weight: bold; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;}
        .molecules-container { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 15px; }

        /* --- TABLEAU DE BILAN --- */
        .bilan-section { background: white; padding: clamp(10px, 2vw, 20px); border-radius: 10px; border: 1px solid #cbd5e1; overflow-x: auto;}
        .bilan-table { width: 100%; border-collapse: collapse; text-align: center; font-size: clamp(0.9em, 1.5vw, 1.1em); }
        .bilan-table th, .bilan-table td { padding: clamp(8px, 1.5vw, 12px); border-bottom: 1px solid #e2e8f0; }
        .bilan-table th { color: var(--text-light); width: 33%; }
        .val-react { font-weight: bold; color: #2563eb; font-size: 1.2em; }
        .val-prod { font-weight: bold; color: #ea580c; font-size: 1.2em; }
        .status-icon { font-size: 1.4em; }

        /* --- FEEDBACK GLOBAL --- */
        .feedback-banner { margin-top: 20px; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; font-size: clamp(1em, 2vw, 1.2em); }
        .f-wait { background: #f1f5f9; color: var(--text-light); border: 1px solid #cbd5e1; }
        .f-success { background: #f0fdf4; color: var(--success); border: 2px solid #bbf7d0; animation: pulse 1.5s infinite alternate;}
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.4); } 100% { box-shadow: 0 0 0 10px rgba(22, 163, 74, 0); } }

        /* --- DESSIN DES MOLÉCULES EN CSS --- */
        .mol { position: relative; display: inline-block; width: 60px; height: 60px; transition: transform 0.3s; transform: scale(0.9);}
        .mol:hover { transform: scale(1.1); }
        .atom { border-radius: 50%; position: absolute; box-shadow: inset -4px -4px 8px rgba(0,0,0,0.4), inset 2px 2px 4px rgba(255,255,255,0.5), 2px 2px 4px rgba(0,0,0,0.2); }
        
        .a-c { background: var(--c-color); width: 36px; height: 36px; z-index: 2; }
        .a-o { background: var(--o-color); width: 30px; height: 30px; z-index: 1; }
        .a-n { background: var(--n-color); width: 34px; height: 34px; z-index: 2; }
        .a-h { background: var(--h-color); width: 20px; height: 20px; border: 1px solid #ccc; z-index: 3; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.1), inset 1px 1px 2px rgba(255,255,255,0.8); }

        /* Positions */
        .mol-c .a-c { top: 12px; left: 12px; }
        .mol-o2 .a-o:nth-child(1) { top: 15px; left: 5px; } .mol-o2 .a-o:nth-child(2) { top: 15px; left: 25px; }
        .mol-h2 { width: 45px; } .mol-h2 .a-h:nth-child(1) { top: 20px; left: 5px; } .mol-h2 .a-h:nth-child(2) { top: 20px; left: 20px; }
        .mol-n2 { width: 60px; } .mol-n2 .a-n:nth-child(1) { top: 13px; left: 5px; } .mol-n2 .a-n:nth-child(2) { top: 13px; left: 25px; }
        
        .mol-co2 .a-o:nth-child(1) { top: 15px; left: 0px; } .mol-co2 .a-c { top: 12px; left: 12px; } .mol-co2 .a-o:nth-child(3) { top: 15px; left: 30px; }
        .mol-h2o .a-o { top: 8px; left: 15px; } .mol-h2o .a-h:nth-child(2) { top: 28px; left: 5px; } .mol-h2o .a-h:nth-child(3) { top: 28px; left: 35px; }
        .mol-nh3 { width: 60px; } .mol-nh3 .a-n { top: 13px; left: 13px; } .mol-nh3 .a-h:nth-child(2) { top: 35px; left: 3px; } .mol-nh3 .a-h:nth-child(3) { top: 35px; left: 37px; } .mol-nh3 .a-h:nth-child(4) { top: 5px; left: 20px; z-index: 1;}
        
        .mol-ch4 .a-c { top: 12px; left: 12px; } .mol-ch4 .a-h:nth-child(2) { top: -4px; left: 20px; } .mol-ch4 .a-h:nth-child(3) { top: 44px; left: 20px; } .mol-ch4 .a-h:nth-child(4) { top: 20px; left: -4px; } .mol-ch4 .a-h:nth-child(5) { top: 20px; left: 44px; }
        
        .mol-c2h6 { width: 80px; }
        .mol-c2h6 .a-c:nth-child(1) { top: 12px; left: 5px; } .mol-c2h6 .a-c:nth-child(2) { top: 12px; left: 35px; }
        .mol-c2h6 .a-h:nth-child(3) { top: -5px; left: 0px; } .mol-c2h6 .a-h:nth-child(4) { top: 35px; left: 0px; } .mol-c2h6 .a-h:nth-child(5) { top: 15px; left: -15px; }
        .mol-c2h6 .a-h:nth-child(6) { top: -5px; left: 45px; } .mol-c2h6 .a-h:nth-child(7) { top: 35px; left: 45px; } .mol-c2h6 .a-h:nth-child(8) { top: 15px; left: 60px; }

        .mol-c3h8 { width: 100px; }
        .mol-c3h8 .a-c:nth-child(1) { top: 20px; left: 8px; } .mol-c3h8 .a-c:nth-child(2) { top: 10px; left: 33px; } .mol-c3h8 .a-c:nth-child(3) { top: 20px; left: 58px; }
        .mol-c3h8 .a-h:nth-child(4) { top: 2px; left: -5px; } .mol-c3h8 .a-h:nth-child(5) { top: 43px; left: -5px; } 
        .mol-c3h8 .a-h:nth-child(6) { top: -8px; left: 40px; } .mol-c3h8 .a-h:nth-child(7) { top: 43px; left: 40px; }
        .mol-c3h8 .a-h:nth-child(8) { top: 2px; left: 80px; } .mol-c3h8 .a-h:nth-child(9) { top: 43px; left: 80px; }
        .mol-c3h8 .a-h:nth-child(10) { top: 24px; left: -15px; } .mol-c3h8 .a-h:nth-child(11) { top: 24px; left: 85px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚖️ Ajuster une équation de réaction</h1>
        <p class="subtitle">Modifie les coefficients pour respecter la <strong>conservation des atomes</strong>.</p>

        <div class="reaction-menu">
            <button class="btn-menu active" onclick="loadReaction('carbone')" id="btn-carbone">1. Carbone</button>
            <button class="btn-menu" onclick="loadReaction('eau')" id="btn-eau">2. Eau (Synthèse)</button>
            <button class="btn-menu" onclick="loadReaction('ammoniac')" id="btn-ammoniac">3. Ammoniac</button>
            <button class="btn-menu" onclick="loadReaction('methane')" id="btn-methane">4. Méthane</button>
            <button class="btn-menu" onclick="loadReaction('ethane')" id="btn-ethane">5. Éthane</button>
            <button class="btn-menu" onclick="loadReaction('propane')" id="btn-propane">6. Propane</button>
        </div>

        <div class="equation-builder">
            <div class="equation-row" id="eq-container">
                </div>
            <button class="btn-edit" id="btn-edit" style="display: none;" onclick="forceEdit()">✏️ Re-modifier l'équation</button>
        </div>

        <div class="visual-arena">
            <div class="arena-side">
                <div class="arena-title">Réactifs (Avant)</div>
                <div class="molecules-container" id="visual-reactants"></div>
            </div>
            <div class="arena-side" style="border-color: #ea580c; background: #fffaf0;">
                <div class="arena-title" style="color: #ea580c;">Produits (Après)</div>
                <div class="molecules-container" id="visual-products"></div>
            </div>
        </div>

        <div class="bilan-section">
            <table class="bilan-table" id="table-bilan">
                <thead>
                    <tr>
                        <th>Atomes</th>
                        <th>Nombre dans les Réactifs</th>
                        <th>Nombre dans les Produits</th>
                        <th>Bilan</th>
                    </tr>
                </thead>
                <tbody id="bilan-body">
                    </tbody>
            </table>

            <div id="global-feedback" class="feedback-banner f-wait">
                L'équation n'est pas encore ajustée.
            </div>
        </div>
    </div>

    <script>
        // --- BASE DE DONNÉES DES RÉACTIONS ---
        const db = {
            carbone: {
                reactants: [
                    { label: 'C', c:1, html: '<div class="mol mol-c"><div class="atom a-c"></div></div>' },
                    { label: 'O<sub>2</sub>', o:2, html: '<div class="mol mol-o2"><div class="atom a-o"></div><div class="atom a-o"></div></div>' }
                ],
                products: [
                    { label: 'CO<sub>2</sub>', c:1, o:2, html: '<div class="mol mol-co2"><div class="atom a-o"></div><div class="atom a-c"></div><div class="atom a-o"></div></div>' }
                ],
                state: { r0: 1, r1: 1, p0: 1 } 
            },
            eau: { 
                reactants: [
                    { label: 'H<sub>2</sub>', h:2, html: '<div class="mol mol-h2"><div class="atom a-h"></div><div class="atom a-h"></div></div>' },
                    { label: 'O<sub>2</sub>', o:2, html: '<div class="mol mol-o2"><div class="atom a-o"></div><div class="atom a-o"></div></div>' }
                ],
                products: [
                    { label: 'H<sub>2</sub>O', h:2, o:1, html: '<div class="mol mol-h2o"><div class="atom a-o"></div><div class="atom a-h"></div><div class="atom a-h"></div></div>' }
                ],
                state: { r0: 1, r1: 1, p0: 1 } 
            },
            ammoniac: { 
                reactants: [
                    { label: 'N<sub>2</sub>', n:2, html: '<div class="mol mol-n2"><div class="atom a-n"></div><div class="atom a-n"></div></div>' },
                    { label: 'H<sub>2</sub>', h:2, html: '<div class="mol mol-h2"><div class="atom a-h"></div><div class="atom a-h"></div></div>' }
                ],
                products: [
                    { label: 'NH<sub>3</sub>', n:1, h:3, html: '<div class="mol mol-nh3"><div class="atom a-n"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div></div>' }
                ],
                state: { r0: 1, r1: 1, p0: 1 } 
            },
            methane: {
                reactants: [
                    { label: 'CH<sub>4</sub>', c:1, h:4, html: '<div class="mol mol-ch4"><div class="atom a-c"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div></div>' },
                    { label: 'O<sub>2</sub>', o:2, html: '<div class="mol mol-o2"><div class="atom a-o"></div><div class="atom a-o"></div></div>' }
                ],
                products: [
                    { label: 'CO<sub>2</sub>', c:1, o:2, html: '<div class="mol mol-co2"><div class="atom a-o"></div><div class="atom a-c"></div><div class="atom a-o"></div></div>' },
                    { label: 'H<sub>2</sub>O', h:2, o:1, html: '<div class="mol mol-h2o"><div class="atom a-o"></div><div class="atom a-h"></div><div class="atom a-h"></div></div>' }
                ],
                state: { r0: 1, r1: 1, p0: 1, p1: 1 }
            },
            ethane: { 
                reactants: [
                    { label: 'C<sub>2</sub>H<sub>6</sub>', c:2, h:6, html: '<div class="mol mol-c2h6"><div class="atom a-c"></div><div class="atom a-c"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div></div>' },
                    { label: 'O<sub>2</sub>', o:2, html: '<div class="mol mol-o2"><div class="atom a-o"></div><div class="atom a-o"></div></div>' }
                ],
                products: [
                    { label: 'CO<sub>2</sub>', c:1, o:2, html: '<div class="mol mol-co2"><div class="atom a-o"></div><div class="atom a-c"></div><div class="atom a-o"></div></div>' },
                    { label: 'H<sub>2</sub>O', h:2, o:1, html: '<div class="mol mol-h2o"><div class="atom a-o"></div><div class="atom a-h"></div><div class="atom a-h"></div></div>' }
                ],
                state: { r0: 1, r1: 1, p0: 1, p1: 1 }
            },
            propane: {
                reactants: [
                    { label: 'C<sub>3</sub>H<sub>8</sub>', c:3, h:8, html: '<div class="mol mol-c3h8"><div class="atom a-c"></div><div class="atom a-c"></div><div class="atom a-c"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div><div class="atom a-h"></div></div>' },
                    { label: 'O<sub>2</sub>', o:2, html: '<div class="mol mol-o2"><div class="atom a-o"></div><div class="atom a-o"></div></div>' }
                ],
                products: [
                    { label: 'CO<sub>2</sub>', c:1, o:2, html: '<div class="mol mol-co2"><div class="atom a-o"></div><div class="atom a-c"></div><div class="atom a-o"></div></div>' },
                    { label: 'H<sub>2</sub>O', h:2, o:1, html: '<div class="mol mol-h2o"><div class="atom a-o"></div><div class="atom a-h"></div><div class="atom a-h"></div></div>' }
                ],
                state: { r0: 1, r1: 1, p0: 1, p1: 1 }
            }
        };

        let currentRx = 'carbone';
        let forceEditMode = false;

        function loadReaction(rxKey) {
            currentRx = rxKey;
            forceEditMode = false;
            
            document.querySelectorAll('.btn-menu').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + rxKey).classList.add('active');

            let state = db[currentRx].state;
            for(let k in state) state[k] = 1;

            renderEquation();
            updateUI();
        }

        function renderEquation() {
            const rx = db[currentRx];
            let html = '';

            rx.reactants.forEach((mol, index) => {
                if(index > 0) html += `<span class="eq-plus">+</span>`;
                html += `
                    <div class="eq-term">
                        <div class="coef-widget">
                            <button class="btn-coef" onclick="modCoef('r${index}', -1)">-</button>
                            <div class="coef-val" id="val-r${index}" data-val="${rx.state['r'+index]}">${rx.state['r'+index]}</div>
                            <button class="btn-coef" onclick="modCoef('r${index}', 1)">+</button>
                        </div>
                        <span class="chem-formula">${mol.label}</span>
                    </div>`;
            });

            html += `<span class="eq-arrow">&rarr;</span>`;

            rx.products.forEach((mol, index) => {
                if(index > 0) html += `<span class="eq-plus">+</span>`;
                html += `
                    <div class="eq-term">
                        <div class="coef-widget">
                            <button class="btn-coef" onclick="modCoef('p${index}', -1)">-</button>
                            <div class="coef-val" id="val-p${index}" data-val="${rx.state['p'+index]}">${rx.state['p'+index]}</div>
                            <button class="btn-coef" onclick="modCoef('p${index}', 1)">+</button>
                        </div>
                        <span class="chem-formula">${mol.label}</span>
                    </div>`;
            });

            document.getElementById('eq-container').innerHTML = html;
        }

        function modCoef(key, delta) {
            let rx = db[currentRx];
            let newVal = rx.state[key] + delta;
            
            if(newVal >= 1 && newVal <= 15) { 
                rx.state[key] = newVal;
                let el = document.getElementById('val-' + key);
                el.innerText = newVal;
                el.setAttribute('data-val', newVal);
                forceEditMode = false;
                updateUI();
            }
        }

        function forceEdit() {
            forceEditMode = true;
            updateUI();
        }

        function updateUI() {
            const rx = db[currentRx];
            
            // 1. Visuels
            let vReact = '';
            rx.reactants.forEach((mol, idx) => {
                let coef = rx.state['r'+idx];
                for(let i=0; i<coef; i++) vReact += mol.html;
            });
            document.getElementById('visual-reactants').innerHTML = vReact;

            let vProd = '';
            rx.products.forEach((mol, idx) => {
                let coef = rx.state['p'+idx];
                for(let i=0; i<coef; i++) vProd += mol.html;
            });
            document.getElementById('visual-products').innerHTML = vProd;

            // 2. Compter atomes
            let totals = { r: {c:0, h:0, o:0, n:0}, p: {c:0, h:0, o:0, n:0} };

            rx.reactants.forEach((mol, idx) => {
                let coef = rx.state['r'+idx];
                totals.r.c += (mol.c || 0) * coef;
                totals.r.h += (mol.h || 0) * coef;
                totals.r.o += (mol.o || 0) * coef;
                totals.r.n += (mol.n || 0) * coef;
            });

            rx.products.forEach((mol, idx) => {
                let coef = rx.state['p'+idx];
                totals.p.c += (mol.c || 0) * coef;
                totals.p.h += (mol.h || 0) * coef;
                totals.p.o += (mol.o || 0) * coef;
                totals.p.n += (mol.n || 0) * coef;
            });

            // 3. Bilan
            let tbody = '';
            let allBalanced = true;
            let atLeastOneType = false;

            const checkRow = (atomName, symbol, countR, countP) => {
                if(countR === 0 && countP === 0) return; 
                atLeastOneType = true;
                let isEq = (countR === countP);
                if(!isEq) allBalanced = false;
                
                let icon = isEq ? '✅' : '❌';
                let color = isEq ? '#16a34a' : '#dc2626';

                tbody += `
                    <tr>
                        <td><strong>${atomName} (${symbol})</strong></td>
                        <td class="val-react">${countR}</td>
                        <td class="val-prod">${countP}</td>
                        <td class="status-icon" style="color:${color}">${icon}</td>
                    </tr>`;
            };

            checkRow('Carbone', 'C', totals.r.c, totals.p.c);
            checkRow('Hydrogène', 'H', totals.r.h, totals.p.h);
            checkRow('Oxygène', 'O', totals.r.o, totals.p.o);
            checkRow('Azote', 'N', totals.r.n, totals.p.n);

            document.getElementById('bilan-body').innerHTML = tbody;

            // 4. Succès et disparition
            const feedback = document.getElementById('global-feedback');
            const eqContainer = document.getElementById('eq-container');
            const btnEdit = document.getElementById('btn-edit');

            if(allBalanced && atLeastOneType && !forceEditMode) {
                eqContainer.classList.add('is-balanced');
                btnEdit.style.display = 'inline-block';
                feedback.className = 'feedback-banner f-success';
                feedback.innerHTML = "🎉 <strong>Bravo !</strong> L'équation est ajustée. Remarque : le coefficient 1 s'écrit de manière invisible !";
            } else {
                eqContainer.classList.remove('is-balanced');
                btnEdit.style.display = 'none';
                feedback.className = 'feedback-banner f-wait';
                feedback.innerHTML = "Ajuste les coefficients pour que les atomes se conservent.";
            }
        }

        window.onload = () => loadReaction('carbone');

    </script>
</body>
</html>
